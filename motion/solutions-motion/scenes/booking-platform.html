<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Booking & Appointment Platforms</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root{--bg:#0e0d0b;--panel:#171512;--panel2:#1f1c18;--paper:#ece5d8;--ink:#ede5d6;--ink2:#cfc6b5;--muted:#918979;--line:rgba(237,229,214,.12);--line2:rgba(237,229,214,.22);--accent:#8e9bff;--accentd:#2b3bff;--mint:#4fe3c9;--signal:#ff7a45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:radial-gradient(55% 65% at 12% 8%,rgba(142,155,255,.20),transparent 60%),radial-gradient(50% 60% at 92% 96%,rgba(79,227,201,.15),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.3;-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.scene{position:absolute;inset:0}
.eyebrow{position:absolute;left:52px;top:40px;display:flex;gap:10px;align-items:center;font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:96px 72px 56px}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.75);overflow:hidden}
.bar{display:flex;gap:7px;align-items:center;height:40px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.bar i{display:block;width:11px;height:11px;border-radius:50%;background:#3d392f}
.bar span{margin-left:10px;font:500 12px ui-monospace,Consolas,monospace;color:var(--muted)}
.mono{font-family:ui-monospace,Consolas,monospace}
.label{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(23,21,18,.92);font:600 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);white-space:nowrap}
.chip b{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.chip.accent{border-color:rgba(142,155,255,.5);color:var(--accent)}
.chip.mint{border-color:rgba(79,227,201,.45);color:var(--mint)}
.chip.signal{border-color:rgba(255,122,69,.5);color:var(--signal)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.skel{display:block;height:8px;border-radius:4px;background:rgba(237,229,214,.14)}
.ok{color:var(--mint)}
.toast{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#24211c;border:1px solid var(--line2);font:600 14px/1.2 ui-sans-serif,system-ui,sans-serif;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.toast b{display:block;width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none}
.cal{position:relative;width:640px;padding:20px 22px}.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.dh{font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;text-align:center}.slot{height:46px;border-radius:8px;background:rgba(237,229,214,.04);border:1px solid var(--line)}.bkd{position:absolute;height:46px;border-radius:8px;background:rgba(142,155,255,.35);border:1px solid rgba(142,155,255,.7);padding:7px 9px;font:600 11px ui-sans-serif,system-ui,sans-serif;color:var(--ink)}.side{display:flex;flex-direction:column;gap:14px;width:330px}.nb{padding:18px}.nb p{font-weight:800;font-size:17px;margin-top:8px}.nb small{display:block;margin-top:6px;color:var(--ink2);font-size:14px}</style>
  </head>
  <body>
    <div id="root" data-composition-id="booking_platform" data-start="0" data-width="1280" data-height="720" data-duration="8">
      <div class="bg"></div>
      <div class="grid"></div>
      <section id="scene" class="scene clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="eyebrow" class="eyebrow"><i></i>Booking & Appointment Platforms</div>
        <div id="content" class="stage"><div class="win" style=""><div class="bar"><i></i><i></i><i></i><span>Bookings · Glow Salon</span></div><div class="cal"><div class="cg"><div class="dh">Mon</div><div class="dh">Tue</div><div class="dh">Wed</div><div class="dh">Thu</div><div class="dh">Fri</div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div id="bk0" class="bkd" style="left:22px;top:106px;width:111px">Haircut</div><div id="bk1" class="bkd" style="left:143.2px;top:218px;width:111px">Facial</div><div id="bk2" class="bkd" style="left:264.4px;top:50px;width:111px">Colour</div><div id="bk3" class="bkd" style="left:385.6px;top:162px;width:111px">Manicure</div><div id="bk4" class="bkd" style="left:22px;top:274px;width:111px">Spa</div><div id="bk5" class="bkd" style="left:506.8px;top:106px;width:111px">Haircut</div><div id="bk6" class="bkd" style="left:264.4px;top:218px;width:111px">Facial</div><div id="bk7" class="bkd" style="left:143.2px;top:50px;width:111px">Colour</div><div id="bk8" class="bkd" style="left:506.8px;top:274px;width:111px">Manicure</div><div id="bk9" class="bkd" style="left:385.6px;top:218px;width:111px">Spa</div></div></div><div class="side"><div id="nb" class="card nb"><span class="label" style="color:var(--mint)">New booking</span><p>Haircut · Thu 3:00 PM</p><small>Deposit paid online · Riya M.</small></div><div id="rm" class="chip accent"><b style="background:var(--accent)"></b>Reminder sent on WhatsApp</div><div id="ns" class="chip mint"><b></b>Slot confirmed by customer</div></div></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const show = (sel, at, from) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, y: 14 }, from || {}), { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, at);
      const type = (sel, at, dur) => tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur || 1, ease: "none" }, at);
      const count = (sel, to, at, dur, fmt) => { const o = { v: 0 }; const el = document.querySelector(sel); tl.to(o, { v: to, duration: dur || 1, ease: "power2.out", onUpdate: () => { el.textContent = (fmt || ((v) => Math.round(v)))(o.v); } }, at); };
      tl.fromTo("#eyebrow", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#content", { autoAlpha: 0, scale: 0.965 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);

      show("#bk0", 0.8, { scale: 0.7, y: 0 }); show("#bk1", 1.08, { scale: 0.7, y: 0 }); show("#bk2", 1.36, { scale: 0.7, y: 0 }); show("#bk3", 1.6400000000000001, { scale: 0.7, y: 0 }); show("#bk4", 1.9200000000000002, { scale: 0.7, y: 0 }); show("#bk5", 2.2, { scale: 0.7, y: 0 }); show("#bk6", 2.4800000000000004, { scale: 0.7, y: 0 }); show("#bk7", 2.7600000000000002, { scale: 0.7, y: 0 }); show("#bk8", 3.04, { scale: 0.7, y: 0 }); show("#bk9", 3.3200000000000003, { scale: 0.7, y: 0 });
      show("#nb", 2.6, { x: 20 }); show("#rm", 4.2, { x: 20 }); show("#ns", 5.2, { x: 20 });
      tl.to(["#content", "#eyebrow"], { autoAlpha: 0, scale: 0.985, duration: 0.55, ease: "power2.in" }, 7.35);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["booking_platform"] = tl;
    </script>
  </body>
</html>
