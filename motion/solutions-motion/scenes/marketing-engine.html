<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>AI Marketing & Content Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root{--bg:#0e0d0b;--panel:#171512;--panel2:#1f1c18;--paper:#ece5d8;--ink:#ede5d6;--ink2:#cfc6b5;--muted:#918979;--line:rgba(237,229,214,.12);--line2:rgba(237,229,214,.22);--accent:#8e9bff;--accentd:#2b3bff;--mint:#4fe3c9;--signal:#ff7a45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:radial-gradient(55% 65% at 12% 8%,rgba(142,155,255,.20),transparent 60%),radial-gradient(50% 60% at 92% 96%,rgba(79,227,201,.15),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.3;-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.scene{position:absolute;inset:0}
.eyebrow{position:absolute;left:52px;top:40px;display:flex;gap:10px;align-items:center;font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:96px 72px 56px}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.75);overflow:hidden}
.bar{display:flex;gap:7px;align-items:center;height:40px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.bar i{display:block;width:11px;height:11px;border-radius:50%;background:#3d392f}
.bar span{margin-left:10px;font:500 12px ui-monospace,Consolas,monospace;color:var(--muted)}
.mono{font-family:ui-monospace,Consolas,monospace}
.label{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(23,21,18,.92);font:600 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);white-space:nowrap}
.chip b{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.chip.accent{border-color:rgba(142,155,255,.5);color:var(--accent)}
.chip.mint{border-color:rgba(79,227,201,.45);color:var(--mint)}
.chip.signal{border-color:rgba(255,122,69,.5);color:var(--signal)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.skel{display:block;height:8px;border-radius:4px;background:rgba(237,229,214,.14)}
.ok{color:var(--mint)}
.toast{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#24211c;border:1px solid var(--line2);font:600 14px/1.2 ui-sans-serif,system-ui,sans-serif;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.toast b{display:block;width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none}
.mk{position:relative;width:1080px;height:470px}.src{position:absolute;left:0;top:135px;width:300px;padding:20px}.vid{height:120px;border-radius:8px;background:linear-gradient(135deg,#2b3bff,#8e9bff);display:grid;place-items:center}.vid i{display:block;width:0;height:0;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}.out{position:absolute;left:640px;width:400px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.out p{font-weight:700;font-size:15px}.st{padding:5px 9px;border-radius:999px;font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.08em;background:rgba(79,227,201,.15);color:var(--mint)}svg.ln{position:absolute;inset:0}</style>
  </head>
  <body>
    <div id="root" data-composition-id="marketing_engine" data-start="0" data-width="1280" data-height="720" data-duration="8">
      <div class="bg"></div>
      <div class="grid"></div>
      <section id="scene" class="scene clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="eyebrow" class="eyebrow"><i></i>AI Marketing & Content Engine</div>
        <div id="content" class="stage"><div class="mk"><svg class="ln" width="1080" height="470"><path id="p0" d="M300 235 C 470 235, 470 58, 640 58" fill="none" stroke="rgba(142,155,255,.55)" stroke-width="2" stroke-dasharray="420" stroke-dashoffset="420"/><path id="p1" d="M300 235 C 470 235, 470 176, 640 176" fill="none" stroke="rgba(142,155,255,.55)" stroke-width="2" stroke-dasharray="420" stroke-dashoffset="420"/><path id="p2" d="M300 235 C 470 235, 470 294, 640 294" fill="none" stroke="rgba(142,155,255,.55)" stroke-width="2" stroke-dasharray="420" stroke-dashoffset="420"/><path id="p3" d="M300 235 C 470 235, 470 412, 640 412" fill="none" stroke="rgba(142,155,255,.55)" stroke-width="2" stroke-dasharray="420" stroke-dashoffset="420"/></svg>
    <div id="src" class="card src"><span class="label">Source</span><div class="vid" style="margin-top:12px"><i></i></div><p style="margin-top:12px;font-weight:700">Webinar recording · 48 min</p></div>
    <div id="o0" class="card out" style="top:18px"><p>LinkedIn post</p><span id="a0" class="st">APPROVED</span><div style="grid-column:1/-1;display:flex;flex-direction:column;gap:7px;margin-top:4px"><span class="skel" style="width:96%"></span><span class="skel" style="width:78%"></span></div></div><div id="o1" class="card out" style="top:136px"><p>Email campaign</p><span id="a1" class="st">APPROVED</span><div style="grid-column:1/-1;display:flex;flex-direction:column;gap:7px;margin-top:4px"><span class="skel" style="width:96%"></span><span class="skel" style="width:78%"></span></div></div><div id="o2" class="card out" style="top:254px"><p>Instagram carousel</p><span id="a2" class="st">APPROVED</span><div style="grid-column:1/-1;display:flex;flex-direction:column;gap:7px;margin-top:4px"><span class="skel" style="width:96%"></span><span class="skel" style="width:78%"></span></div></div><div id="o3" class="card out" style="top:372px"><p>Ad copy</p><span id="a3" class="st">APPROVED</span><div style="grid-column:1/-1;display:flex;flex-direction:column;gap:7px;margin-top:4px"><span class="skel" style="width:96%"></span><span class="skel" style="width:78%"></span></div></div>
  </div></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const show = (sel, at, from) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, y: 14 }, from || {}), { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, at);
      const type = (sel, at, dur) => tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur || 1, ease: "none" }, at);
      const count = (sel, to, at, dur, fmt) => { const o = { v: 0 }; const el = document.querySelector(sel); tl.to(o, { v: to, duration: dur || 1, ease: "power2.out", onUpdate: () => { el.textContent = (fmt || ((v) => Math.round(v)))(o.v); } }, at); };
      tl.fromTo("#eyebrow", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#content", { autoAlpha: 0, scale: 0.965 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);

      show("#src", 0.6, { x: -20 });
      tl.to("#p0", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 1.3); show("#o0", 1.8, { x: 24 }); show("#a0", 3.9, { scale: 0.6, y: 0 });
      tl.to("#p1", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 1.65); show("#o1", 2.15, { x: 24 }); show("#a1", 4.3, { scale: 0.6, y: 0 });
      tl.to("#p2", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2); show("#o2", 2.5, { x: 24 }); show("#a2", 4.7, { scale: 0.6, y: 0 });
      tl.to("#p3", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.3499999999999996); show("#o3", 2.8499999999999996, { x: 24 }); show("#a3", 5.1, { scale: 0.6, y: 0 });
      tl.to(["#content", "#eyebrow"], { autoAlpha: 0, scale: 0.985, duration: 0.55, ease: "power2.in" }, 7.35);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["marketing_engine"] = tl;
    </script>
  </body>
</html>
