<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Document & Invoice Processing</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root{--bg:#0e0d0b;--panel:#171512;--panel2:#1f1c18;--paper:#ece5d8;--ink:#ede5d6;--ink2:#cfc6b5;--muted:#918979;--line:rgba(237,229,214,.12);--line2:rgba(237,229,214,.22);--accent:#8e9bff;--accentd:#2b3bff;--mint:#4fe3c9;--signal:#ff7a45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0;background:radial-gradient(55% 65% at 12% 8%,rgba(142,155,255,.20),transparent 60%),radial-gradient(50% 60% at 92% 96%,rgba(79,227,201,.15),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.3;-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.scene{position:absolute;inset:0}
.eyebrow{position:absolute;left:52px;top:40px;display:flex;gap:10px;align-items:center;font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:96px 72px 56px}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 90px -30px rgba(0,0,0,.75);overflow:hidden}
.bar{display:flex;gap:7px;align-items:center;height:40px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.bar i{display:block;width:11px;height:11px;border-radius:50%;background:#3d392f}
.bar span{margin-left:10px;font:500 12px ui-monospace,Consolas,monospace;color:var(--muted)}
.mono{font-family:ui-monospace,Consolas,monospace}
.label{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(23,21,18,.92);font:600 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);white-space:nowrap}
.chip b{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint)}
.chip.accent{border-color:rgba(142,155,255,.5);color:var(--accent)}
.chip.mint{border-color:rgba(79,227,201,.45);color:var(--mint)}
.chip.signal{border-color:rgba(255,122,69,.5);color:var(--signal)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.skel{display:block;height:8px;border-radius:4px;background:rgba(237,229,214,.14)}
.ok{color:var(--mint)}
.toast{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#24211c;border:1px solid var(--line2);font:600 14px/1.2 ui-sans-serif,system-ui,sans-serif;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.toast b{display:block;width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none}
.paper{position:relative;width:360px;height:470px;border-radius:10px;background:var(--paper);color:#15130f;padding:28px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}.paper h3{font:800 22px ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}.pl{display:block;height:7px;border-radius:4px;background:rgba(21,19,15,.15);margin-top:10px}.hl{position:absolute;left:22px;right:22px;height:30px;border-radius:6px;border:2px solid var(--accentd);background:rgba(43,59,255,.08)}.scan{position:absolute;left:0;right:0;top:0;height:3px;background:var(--mint);box-shadow:0 0 18px 4px rgba(79,227,201,.6)}.form{width:470px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}.fld{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}.fld span.v{font-size:16px;font-weight:600}.ck{width:22px;height:22px;border-radius:50%;background:var(--mint);color:#0e0d0b;display:grid;place-items:center;font:800 13px ui-sans-serif,system-ui,sans-serif}</style>
  </head>
  <body>
    <div id="root" data-composition-id="document_automation" data-start="0" data-width="1280" data-height="720" data-duration="8">
      <div class="bg"></div>
      <div class="grid"></div>
      <section id="scene" class="scene clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="eyebrow" class="eyebrow"><i></i>Document & Invoice Processing</div>
        <div id="content" class="stage"><div class="paper"><h3>INVOICE</h3><p class="mono" style="font-size:12px;margin-top:6px;color:#5b554a">Acme Supplies Ltd. · INV-20931</p><span class="pl" style="width:90%"></span><span class="pl" style="width:74%"></span><span class="pl" style="width:86%"></span><span class="pl" style="width:62%"></span><div style="margin-top:22px"><span class="pl" style="width:92%"></span><span class="pl" style="width:80%"></span><span class="pl" style="width:88%"></span><span class="pl" style="width:70%"></span><span class="pl" style="width:84%"></span><span class="pl" style="width:76%"></span></div><p style="margin-top:26px;font:800 20px ui-sans-serif,system-ui,sans-serif;text-align:right">₹48,250.00</p>
    <div id="h0" class="hl" style="top:58px"></div><div id="h1" class="hl" style="top:92px"></div><div id="h2" class="hl" style="top:128px"></div><div id="h3" class="hl" style="top:288px"></div><div id="scan" class="scan"></div></div>
  <div class="win" style=""><div class="bar"><i></i><i></i><i></i><span>Extracted · AP automation</span></div><div class="form"><div class="fld"><span class="label">Vendor</span><span id="v0" class="v">Acme Supplies Ltd.</span><span id="k0" class="ck">✓</span></div><div class="fld"><span class="label">Invoice no.</span><span id="v1" class="v">INV-20931</span><span id="k1" class="ck">✓</span></div><div class="fld"><span class="label">Date</span><span id="v2" class="v">12 Sep 2026</span><span id="k2" class="ck">✓</span></div><div class="fld"><span class="label">Total</span><span id="v3" class="v">₹48,250.00</span><span id="k3" class="ck">✓</span></div><div id="sy" class="chip mint" style="align-self:flex-start;margin-top:4px"><b></b>Synced to accounting</div></div></div></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const show = (sel, at, from) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, y: 14 }, from || {}), { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, at);
      const type = (sel, at, dur) => tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur || 1, ease: "none" }, at);
      const count = (sel, to, at, dur, fmt) => { const o = { v: 0 }; const el = document.querySelector(sel); tl.to(o, { v: to, duration: dur || 1, ease: "power2.out", onUpdate: () => { el.textContent = (fmt || ((v) => Math.round(v)))(o.v); } }, at); };
      tl.fromTo("#eyebrow", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#content", { autoAlpha: 0, scale: 0.965 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);

      tl.fromTo("#scan", { y: 0, autoAlpha: 0 }, { y: 466, autoAlpha: 1, duration: 1.8, ease: "sine.inOut" }, 0.7);
      tl.to("#scan", { autoAlpha: 0, duration: 0.2 }, 2.5);
      tl.fromTo("#h0", { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, 1.2); type("#v0", 2.6, 0.45); show("#k0", 3.05, { scale: 0.4, y: 0 });
      tl.fromTo("#h1", { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, 1.5499999999999998); type("#v1", 3.2, 0.45); show("#k1", 3.65, { scale: 0.4, y: 0 });
      tl.fromTo("#h2", { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, 1.9); type("#v2", 3.8, 0.45); show("#k2", 4.25, { scale: 0.4, y: 0 });
      tl.fromTo("#h3", { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.3 }, 2.25); type("#v3", 4.4, 0.45); show("#k3", 4.85, { scale: 0.4, y: 0 });
      show("#sy", 5.6);
      tl.to(["#content", "#eyebrow"], { autoAlpha: 0, scale: 0.985, duration: 0.55, ease: "power2.in" }, 7.35);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["document_automation"] = tl;
    </script>
  </body>
</html>
